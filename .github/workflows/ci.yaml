name: backend app CI process
on:
  workflow_dispatch:
jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Read app version from package.json
        run: |
          version=$( jq -r .version package.json)
          echo "appVersion=$version" >> $GITHUB_ENV
      - name: Display app version
        run: |
          echo "version is: ${{ env.appVersion }}"

         

        
