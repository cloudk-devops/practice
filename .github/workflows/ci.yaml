name: backend
on: 
  workflow_dispatch:
# env:
#   appVersion: ""
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v5
      - name: display files
        run: |
          ls -l
      - name: read app version
        run: |
         echo "appVersion=$(jq -r .version package.json)" >> $GITHUB_ENV
         echo "appVersion=${{ env.appVersion }}"

        
