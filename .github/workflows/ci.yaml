name: backend
on: 
  workflow_dispatch:
# env:
#   appVersion: ""
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v5
      - name: display files
        run: |
          ls -l
      - name: read app version
        run: |
         appVersion=$(jq -r .version package.json)
         echo "appVersion=$appVersion" >> $GITHUB_ENV
         echo "appVersion=$appVersion"

        
