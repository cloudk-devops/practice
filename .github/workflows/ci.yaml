name: backend
on: 
  workflow_dispatch:
# env:
#   appVersion: ""
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v5
      - name: display files
        run: |
          ls -l
      - name: read app version
        id: get_version
        run: |
         echo "appVersion=$(jq -r .version package.json)" >> $GITHUB_OUTPUT
      - name: display app version
        run: |
          echo "appVersion=${{ steps.get_version.outputs.appVersion }}"
      - name: install package dependencies
        run: npm install
         
         

        
