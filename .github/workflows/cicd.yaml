name: CI Workflow

on: [push]

jobs:
  # 1. Your primary workload job
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Run tasks
        run: |
          echo "Doing some setup..."
          sleep 100 # If this fails, the job fails.

  # 2. The auto-retry helper job
  retry-on-failure:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: failure() && github.run_attempt < 3 # Retries up to 2 times (3 total attempts)
    permissions:
      actions: write # Required to trigger a workflow re-run
    steps:
      - name: Automatically trigger retry for failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Main job failed! Triggering automatic retry..."
          # Re-runs only the failed job within this active workflow run
          gh run rerun ${{ github.run_id }} --failed

