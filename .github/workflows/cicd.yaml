on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  print_hello:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello..Muneer"
      # - run: sleep 1000
  retry-on-failure:
    runs-on: ubuntu-latest
    needs: print_hello
    if: failure() && github.run_attempt < 3
    steps:
      - 
        env:
          GH_TOKEN: ${{ github.token }}
        run: sleep10


